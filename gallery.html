<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CLens • Thư viện</title>
    
    <!-- Khai báo App PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CLens">
    <link rel="apple-touch-icon" href="icon.png">

    <link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a855f7' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cline x1='14.31' y1='8' x2='20.05' y2='17.94'/%3E%3Cline x1='9.69' y1='8' x2='21.17' y2='8'/%3E%3Cline x1='7.38' y1='12' x2='13.12' y2='2.06'/%3E%3Cline x1='9.69' y1='16' x2='3.95' y2='6.06'/%3E%3Cline x1='14.31' y1='16' x2='2.83' y2='16'/%3E%3Cline x1='16.62' y1='12' x2='10.88' y2='21.94'/%3E%3C/svg%3E" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000000; --accent: #a855f7; --accent-glow: rgba(168, 85, 247, 0.12); --border: rgba(255,255,255,0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: var(--bg); color: #fff; min-height: 100vh; overflow-x: hidden; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        img { -webkit-user-drag: none; pointer-events: none; }
        
        .ambient-glow { position: fixed; top: -15vh; left: 50%; transform: translateX(-50%); width: 120vw; height: 70vh; background: radial-gradient(ellipse at center, var(--accent-glow) 0%, rgba(0,0,0,0) 65%); z-index: -1; pointer-events: none; }
        
        header { position: sticky; top: 0; z-index: 50; padding: 24px 6%; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 100%); }
        .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 19px; color: #fff; letter-spacing: -0.5px; opacity: 0.95; }
        .brand svg { width: 24px; height: 24px; color: var(--accent); }
        .status-pill { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); padding: 8px 16px; border-radius: 30px; font-size: 12px; color: #a1a1aa; font-weight: 500; letter-spacing: 0.3px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }

        main { padding: 10px 6% 50px 6%; max-width: 1400px; margin: 0 auto; min-height: 80vh; }
        
        .loader-box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 50vh; gap: 20px; color: #a1a1aa; font-size: 14px; font-weight: 500; letter-spacing: 0.5px; transition: 0.4s;}
        .spinner { width: 34px; height: 34px; border: 2px solid rgba(255,255,255,0.06); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s cubic-bezier(0.6, 0.1, 0.4, 0.9) infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; }
        @media (min-width: 600px) { .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; } }
        @media (min-width: 1024px) { .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 28px; } }
        
        .card { position: relative; aspect-ratio: 1; border-radius: 22px; overflow: hidden; background: #050505; border: 1px solid var(--border); transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); display: block; animation: fadeScale 0.7s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
        @keyframes fadeScale { from { opacity: 0; transform: scale(0.92) translateY(25px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        
        .card:hover { transform: translateY(-8px) scale(1.04); border-color: rgba(168, 85, 247, 0.5); box-shadow: 0 20px 40px rgba(168, 85, 247, 0.2), 0 5px 15px rgba(0,0,0,0.9); z-index: 2;}
        .card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); filter: brightness(0.9); }
        .card:hover img { transform: scale(1.12); filter: brightness(1.05); }
        
        .card-info { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(0deg, rgba(0,0,0,0.95), transparent); padding: 35px 16px 16px 16px; opacity: 0; transition: 0.4s ease; }
        .card:hover .card-info { opacity: 1; }
        .id-tag { background: rgba(255,255,255,0.12); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); color: #fff; font-size: 11px; padding: 6px 12px; border-radius: 10px; font-weight: 500; letter-spacing: 0.8px;}
        
        .empty { grid-column: 1/-1; text-align: center; padding: 100px 0; color: #71717a; font-size: 15px; font-weight: 400; background: rgba(255,255,255,0.02); border-radius: 28px; border: 1px dashed rgba(255,255,255,0.15); }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <header>
        <div class="brand">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="14.31" y1="8" x2="20.05" y2="17.94"></line>
                <line x1="9.69" y1="8" x2="21.17" y2="8"></line>
                <line x1="7.38" y1="12" x2="13.12" y2="2.06"></line>
                <line x1="9.69" y1="16" x2="3.95" y2="6.06"></line>
                <line x1="14.31" y1="16" x2="2.83" y2="16"></line>
                <line x1="16.62" y1="12" x2="10.88" y2="21.94"></line>
            </svg>
            CLens
        </div>
        <div class="status-pill">Đã đồng bộ</div>
    </header>

    <main>
        <div class="loader-box" id="loader"><div class="spinner"></div>Tải thư viện...</div>
        <div class="grid" id="grid"></div>
    </main>

    <script src="Data.js"></script>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => { if((e.ctrlKey||e.metaKey) && ['s','p','u'].includes(e.key)) e.preventDefault(); if(e.key==='F12') e.preventDefault(); });

        const grid = document.getElementById('grid'), loader = document.getElementById('loader');

        const render = (data) => {
            if(!data || data.length===0) { grid.innerHTML = `<div class="empty">Kho ảnh trống.</div>`; return; }
            let html = '';
            data.forEach((img, i) => {
                html += `
                    <a href="view.html?id=${img.id}" class="card" style="animation-delay: ${i*0.05}s">
                        <img src="${img.thumb}" loading="lazy">
                        <div class="card-info"><span class="id-tag">${img.id}</span></div>
                    </a>
                `;
            });
            grid.innerHTML = html;
        }

        const fetchGallery = () => {
            CLensData.getGallery().then(res => {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 300);
                if(res.status === 'success') {
                    render(res.data);
                }
            }).catch(() => { 
                loader.style.display='none'; 
                grid.innerHTML=`<div class="empty">Lỗi kết nối. Vui lòng tải lại trang.</div>`; 
            });
        }

        fetchGallery(); // Tải 1 lần duy nhất khi mở trang
    </script>
</body>
</html>
