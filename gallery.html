<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Thư viện</title>
    <link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a855f7'%3E%3Cpath d='M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5-5-5 5h3v4h4v-4h3z'/%3E%3C/svg%3E" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000000; --accent: #a855f7; --glass: rgba(10, 10, 10, 0.75); --border: rgba(255,255,255,0.06); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: var(--bg); color: #fff; min-height: 100vh; overflow-x: hidden; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        img { -webkit-user-drag: none; pointer-events: none; }
        
        .spotlight { position: fixed; top: -10vh; left: 50%; transform: translateX(-50%); width: 100vw; height: 50vh; background: radial-gradient(ellipse at center, rgba(168, 85, 247, 0.1) 0%, rgba(0,0,0,0) 70%); z-index: -1; pointer-events: none; }
        
        /* Gỡ bỏ link ở Header, thiết kế Minimalist */
        header { position: sticky; top: 0; z-index: 50; background: var(--glass); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-bottom: 1px solid var(--border); padding: 16px 5%; display: flex; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; color: #fff; letter-spacing: -0.5px; }
        .brand svg { width: 22px; height: 22px; fill: var(--accent); }
        .status-pill { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; font-size: 12px; color: #a1a1aa; font-weight: 500; letter-spacing: 0.2px;}

        main { padding: 32px 5%; max-width: 1400px; margin: 0 auto; min-height: 80vh; }
        
        .loader-box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 40vh; gap: 16px; color: #a1a1aa; font-size: 13px; font-weight: 500;}
        .spinner { width: 28px; height: 28px; border: 2px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; }
        @media (min-width: 600px) { .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; } }
        @media (min-width: 1024px) { .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px; } }
        
        .card { position: relative; aspect-ratio: 1; border-radius: 20px; overflow: hidden; background: #09090b; border: 1px solid var(--border); transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); display: block; animation: fadeUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .card:hover { transform: translateY(-6px) scale(1.02); border-color: rgba(255,255,255,0.15); box-shadow: 0 15px 30px rgba(0,0,0,0.6); z-index: 2;}
        .card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .card:hover img { transform: scale(1.08); }
        
        .card-info { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(0deg, rgba(0,0,0,0.9), transparent); padding: 30px 12px 12px 12px; opacity: 0; transition: 0.4s; }
        .card:hover .card-info { opacity: 1; }
        .id-tag { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #fff; font-size: 11px; padding: 6px 10px; border-radius: 8px; font-weight: 500; letter-spacing: 0.5px;}
        
        .empty { grid-column: 1/-1; text-align: center; padding: 60px 0; color: #a1a1aa; font-size: 14px; background: rgba(255,255,255,0.02); border-radius: 24px; border: 1px dashed rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div class="spotlight"></div>

    <header>
        <!-- Thẻ DIV thuần túy, không có thẻ a href -->
        <div class="brand">
            <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5-5-5 5h3v4h4v-4h3z"/></svg>
            CLens
        </div>
        <div class="status-pill">Đã đồng bộ</div>
    </header>

    <main>
        <div class="loader-box" id="loader"><div class="spinner"></div>Đang tải dữ liệu...</div>
        <div class="grid" id="grid"></div>
    </main>

    <script src="Data.js"></script>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => { if((e.ctrlKey||e.metaKey) && ['s','p','u'].includes(e.key)) e.preventDefault(); if(e.key==='F12') e.preventDefault(); });

        const grid = document.getElementById('grid'), loader = document.getElementById('loader');

        const render = (data) => {
            if(!data || data.length===0) { grid.innerHTML = `<div class="empty">Kho ảnh trống.</div>`; return; }
            let html = '';
            data.forEach((img, i) => {
                html += `
                    <a href="view?id=${img.id}" class="card" style="animation-delay: ${i*0.04}s">
                        <img src="${img.thumb}" loading="lazy">
                        <div class="card-info"><span class="id-tag">${img.id}</span></div>
                    </a>
                `;
            });
            grid.innerHTML = html;
        }

        const fetchGallery = () => {
            CLensData.getGallery().then(res => {
                loader.style.display = 'none';
                if(res.status === 'success') {
                    render(res.data);
                }
            }).catch(() => { 
                loader.style.display='none'; 
                grid.innerHTML=`<div class="empty">Lỗi kết nối. Vui lòng tải lại trang.</div>`; 
            });
        }

        fetchGallery(); // Tải 1 lần duy nhất khi mở trang
    </script>
</body>
</html>
