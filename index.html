<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CLens • Upload</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CLens">
    <link rel="apple-touch-icon" href="icon.png">

    <link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a855f7' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cline x1='14.31' y1='8' x2='20.05' y2='17.94'/%3E%3Cline x1='9.69' y1='8' x2='21.17' y2='8'/%3E%3Cline x1='7.38' y1='12' x2='13.12' y2='2.06'/%3E%3Cline x1='9.69' y1='16' x2='3.95' y2='6.06'/%3E%3Cline x1='14.31' y1='16' x2='2.83' y2='16'/%3E%3Cline x1='16.62' y1='12' x2='10.88' y2='21.94'/%3E%3C/svg%3E" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000000; --accent: #a855f7; --accent-glow: rgba(168, 85, 247, 0.2); --glass: rgba(18, 18, 20, 0.65); --border: rgba(255, 255, 255, 0.08); --text-main: #ffffff; --text-sub: #a1a1aa; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; overflow: hidden; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        img { -webkit-user-drag: none; pointer-events: none; }

        .ambient-glow { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70vw; height: 70vw; max-width: 600px; max-height: 600px; background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 65%); filter: blur(60px); z-index: -1; pointer-events: none; animation: pulse-glow 7s ease-in-out infinite alternate; }
        @keyframes pulse-glow { 0% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.95); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } }

        .widget-card { background: var(--glass); backdrop-filter: blur(50px); -webkit-backdrop-filter: blur(50px); border: 1px solid var(--border); border-radius: 36px; padding: 45px 32px; width: 100%; max-width: 420px; box-shadow: 0 40px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.08); display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; z-index: 1; animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .icon-wrap { width: 64px; height: 64px; background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.01)); border: 1px solid rgba(255,255,255,0.12); border-radius: 20px; display: flex; justify-content: center; align-items: center; margin-bottom: 24px; box-shadow: 0 12px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1); }
        .icon-wrap svg { width: 32px; height: 32px; color: var(--accent); }
        
        h1 { font-size: 26px; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.5px; }
        p.sub { color: var(--text-sub); font-size: 14px; margin-bottom: 36px; font-weight: 400; letter-spacing: 0.2px; }

        .bento-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; }
        .bento-btn { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 22px; padding: 26px 12px; display: flex; flex-direction: column; align-items: center; gap: 14px; cursor: pointer; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .bento-btn:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.25); transform: translateY(-5px); box-shadow: 0 12px 24px rgba(0,0,0,0.4); }
        .bento-btn svg { width: 28px; height: 28px; stroke: #fff; stroke-width: 1.2; fill: none; opacity: 0.8; transition: 0.4s; }
        .bento-btn:hover svg { opacity: 1; stroke: var(--accent); transform: scale(1.1); }
        .bento-btn span { font-weight: 500; font-size: 13px; color: #e4e4e7; letter-spacing: 0.3px; }
        
        input[type="file"] { display: none; }
        .preview-box { width: 100%; border-radius: 22px; overflow: hidden; display: none; position: relative; background: #050505; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .preview-box img { width: 100%; max-height: 320px; object-fit: contain; display: block; filter: brightness(0.95); }
        .status-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(12px); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 10; }
        .spinner { width: 34px; height: 34px; border: 2px solid rgba(255,255,255,0.08); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s cubic-bezier(0.6, 0.1, 0.4, 0.9) infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .actions { display: none; gap: 14px; width: 100%; margin-top: 28px; }
        .btn { flex: 1; padding: 15px; border-radius: 16px; font-weight: 500; font-size: 14px; border: none; cursor: pointer; transition: 0.3s; letter-spacing: 0.3px; }
        .btn-cancel { background: transparent; color: var(--text-sub); border: 1px solid rgba(255,255,255,0.15); }
        .btn-submit { background: #fff; color: #000; box-shadow: 0 4px 15px rgba(255,255,255,0.2); font-weight: 600; }
        .btn:hover { transform: translateY(-2px); }
        
        .result-card { display: none; width: 100%; margin-top: 24px; padding: 22px; background: rgba(255,255,255,0.03); border-radius: 20px; border: 1px solid var(--border); animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); text-align: left; }
        .r-label { font-size: 11px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 8px; display: block; font-weight: 600;}
        .r-value { font-size: 18px; font-weight: 500; color: #fff; margin-bottom: 20px; letter-spacing: 0.5px;}
        .copy-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 14px; border-radius: 14px; font-size: 13px; word-break: break-all; cursor: pointer; display: block; transition: 0.3s; text-decoration: none; line-height: 1.5; font-weight: 400;}
        
        .toast { position: fixed; bottom: 40px; left: 50%; transform: translate(-50%, 100px); background: rgba(30,30,30,0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15); padding: 14px 28px; border-radius: 100px; font-size: 14px; font-weight: 500; color: #fff; transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100; box-shadow: 0 15px 40px rgba(0,0,0,0.8); }
        .toast.show { transform: translate(-50%, 0); }

        .install-prompt { position: fixed; bottom: -150px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 380px; background: rgba(20, 20, 22, 0.95); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.15); border-radius: 24px; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 200; box-shadow: 0 20px 50px rgba(0,0,0,0.9); transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .install-prompt.show { bottom: 40px; }
        .install-info { display: flex; align-items: center; gap: 12px; flex: 1; }
        .install-icon { width: 44px; height: 44px; background: rgba(255,255,255,0.05); border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.1);}
        .install-icon svg { width: 22px; height: 22px; color: var(--accent); }
        .install-text h4 { font-size: 14px; font-weight: 600; margin: 0 0 2px 0; color: #fff; }
        .install-text p { font-size: 12px; color: var(--text-sub); margin: 0; line-height: 1.4; }
        .btn-do-install { background: #fff; color: #000; border: none; padding: 8px 16px; border-radius: 12px; font-weight: 600; font-size: 13px; cursor: pointer; }
        .btn-close-install { background: transparent; border: none; color: #71717a; font-size: 20px; cursor: pointer; padding: 4px; }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="widget-card">
        <div id="initView" style="width: 100%;">
            <div class="icon-wrap">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="14.31" y1="8" x2="20.05" y2="17.94"></line><line x1="9.69" y1="8" x2="21.17" y2="8"></line><line x1="7.38" y1="12" x2="13.12" y2="2.06"></line><line x1="9.69" y1="16" x2="3.95" y2="6.06"></line><line x1="14.31" y1="16" x2="2.83" y2="16"></line><line x1="16.62" y1="12" x2="10.88" y2="21.94"></line></svg>
            </div>
            <h1>CLens</h1>
            <p class="sub">Không gian lưu trữ độc bản</p>

            <div class="bento-grid">
                <div class="bento-btn" onclick="document.getElementById('fileCamera').click()">
                    <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                    <span>Máy ảnh</span>
                </div>
                <div class="bento-btn" onclick="document.getElementById('fileGallery').click()">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    <span>Thư viện</span>
                </div>
            </div>
            <input type="file" id="fileCamera" accept="image/*" capture="environment">
            <input type="file" id="fileGallery" accept="image/*">
        </div>

        <div class="preview-box" id="previewBox">
            <img id="imagePreview" src="">
            <div class="status-overlay" id="statusOverlay">
                <div class="spinner"></div>
                <span style="font-size: 13px; font-weight: 500; color: #fff; letter-spacing: 0.5px;">Đang mã hóa...</span>
            </div>
        </div>

        <div class="actions" id="actionGrp">
            <button class="btn btn-cancel" id="btnCancel">Hủy</button>
            <button class="btn btn-submit" id="btnSubmit">Lưu trữ</button>
        </div>

        <div class="result-card" id="resultCard">
            <span class="r-label">Định danh an toàn</span>
            <div class="r-value" id="resId">...</div>
            <span class="r-label">Liên kết gốc (Chạm để chép)</span>
            <a class="copy-btn" id="resLink">...</a>
            <button class="btn btn-cancel" style="width: 100%; margin-top: 20px;" onclick="location.reload()">Lưu ảnh mới</button>
        </div>
    </div>
    
    <div class="toast" id="toast">Thông báo</div>

    <div class="install-prompt" id="installPrompt">
        <div class="install-info">
            <div class="install-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </div>
            <div class="install-text">
                <h4>Cài đặt CLens</h4>
                <p id="installMsg">Tải ứng dụng về máy để trải nghiệm toàn màn hình.</p>
            </div>
        </div>
        <div class="install-actions">
            <button class="btn-do-install" id="btnDoInstall">Cài đặt</button>
            <button class="btn-close-install" id="btnCloseInstall">✕</button>
        </div>
    </div>

    <script src="Data.js"></script>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => { if((e.ctrlKey||e.metaKey) && ['s','p','u'].includes(e.key)) e.preventDefault(); if(e.key==='F12') e.preventDefault(); });

        let file = null;
        const showToast = (msg) => { const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 3000); }

        const compress = (f, cb) => {
            const r = new FileReader(); r.readAsDataURL(f);
            r.onload = e => {
                const i = new Image(); i.src = e.target.result;
                i.onload = () => {
                    const c = document.createElement('canvas');
                    let w = i.width, h = i.height;
                    if (w>h && w>1600){h*=1600/w;w=1600;} else if(h>1600){w*=1600/h;h=1600;}
                    c.width=w; c.height=h;
                    const ctx = c.getContext('2d');
                    ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0,0,w,h);
                    ctx.drawImage(i,0,0,w,h);
                    cb(c.toDataURL('image/jpeg', 0.7));
                }
            }
        }

        const handleSelect = (e) => {
            if(e.target.files[0]) {
                file = e.target.files[0];
                const r = new FileReader();
                r.onload = ev => {
                    document.getElementById('imagePreview').src = ev.target.result;
                    document.getElementById('initView').style.display = 'none';
                    document.getElementById('previewBox').style.display = 'block';
                    document.getElementById('actionGrp').style.display = 'flex';
                }
                r.readAsDataURL(file);
            }
        }

        document.getElementById('fileCamera').addEventListener('change', handleSelect);
        document.getElementById('fileGallery').addEventListener('change', handleSelect);
        document.getElementById('btnCancel').onclick = () => location.reload();

        document.getElementById('btnSubmit').onclick = () => {
            if(!file) return;
            document.getElementById('actionGrp').style.display = 'none';
            document.getElementById('statusOverlay').style.display = 'flex';
            
            compress(file, (b64) => {
                CLensData.upload(b64, file.name, 'image/jpeg')
                .then(d => {
                    document.getElementById('statusOverlay').style.display = 'none';
                    if(d.status === "success"){
                        showToast('Lưu thành công!');
                        document.getElementById('resId').innerText = d.id;
                        const p = window.location.pathname.split('/'); p.pop();
                        const link = window.location.origin + p.join('/') + "/view.html?id=" + d.id;
                        document.getElementById('resLink').innerText = link;
                        document.getElementById('resLink').href = link;
                        document.getElementById('resultCard').style.display = 'block';
                    } else { showToast('Lỗi: '+d.message); document.getElementById('btnCancel').click(); }
                }).catch(()=>{ showToast('Lỗi mạng!'); document.getElementById('btnCancel').click(); });
            });
        }

        document.getElementById('resLink').onclick = (e) => { e.preventDefault(); navigator.clipboard.writeText(e.target.href).then(()=>showToast('Đã chép liên kết!')); }

        // ==========================================
        // CẬP NHẬT: Đường dẫn SW trỏ thẳng vào /thuvien/
        // ==========================================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/thuvien/sw.js', { scope: '/thuvien/' })
                .catch(err => console.log('SW fail'));
        }

        let deferredPrompt;
        const installPrompt = document.getElementById('installPrompt');
        const btnDoInstall = document.getElementById('btnDoInstall');
        const installMsg = document.getElementById('installMsg');
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

        if (!isStandalone) {
            if (isIOS) {
                installMsg.innerText = "Chạm vào biểu tượng 'Chia sẻ' dưới đáy Safari, chọn 'Thêm vào MH chính'.";
                btnDoInstall.style.display = 'none';
                setTimeout(() => installPrompt.classList.add('show'), 2000);
            } else {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    deferredPrompt = e;
                    setTimeout(() => installPrompt.classList.add('show'), 2000);
                });
            }
        }

        btnDoInstall.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') { installPrompt.classList.remove('show'); }
                deferredPrompt = null;
            }
        });

        document.getElementById('btnCloseInstall').addEventListener('click', () => {
            installPrompt.classList.remove('show');
        });
    </script>
</body>
</html>
