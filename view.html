<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CLens</title>
    <link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238b5cf6'%3E%3Cpath d='M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5-5-5 5h3v4h4v-4h3z'/%3E%3C/svg%3E" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); height: 100vh; height: 100dvh; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        .viewer { position: relative; width: 100vw; height: 100%; display: flex; align-items: center; justify-content: center; }
        
        #imgNode { 
            max-width: 94%; /* Tạo khoảng hở so với màn hình để thấy viền */
            max-height: 94vh; 
            object-fit: contain; 
            
            border: 1px solid rgba(255, 255, 255, 0.15); /* Viền mỏng tinh tế */
            border-radius: 12px; /* Bo góc viền */
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); /* Đổ bóng tạo chiều sâu */
            background: rgba(255, 255, 255, 0.02); /* Phông nền mờ lót dưới ảnh */

            opacity: 0; 
            transform: scale(0.97); 
            transition: 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); 
            display: none; 
            pointer-events: none; 
            -webkit-user-drag: none; 
        }
        
        #imgNode.show { opacity: 1; transform: scale(1); }
        .glass-shield { position: absolute; inset: 0; z-index: 10; background: transparent; -webkit-touch-callout: none; }
        
        .brand-watermark { position: absolute; top: 20px; left: 20px; z-index: 20; display: flex; align-items: center; gap: 6px; color: rgba(255, 255, 255, 0.35); font-weight: 600; font-size: 14px; letter-spacing: 0.5px; pointer-events: none; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .brand-watermark svg { width: 18px; height: 18px; fill: rgba(255, 255, 255, 0.35); filter: drop-shadow(0 2px 10px rgba(0,0,0,0.8)); }
        
        .loader { position: absolute; color: #fff; font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 5; }
        .spin { width: 30px; height: 30px; border: 2px solid rgba(255,255,255,0.1); border-top-color: #8b5cf6; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .error { color: #ef4444; background: rgba(239, 68, 68, 0.1); padding: 12px 20px; border-radius: 12px; display: none; z-index: 5; font-weight: 500; }
    </style>
</head>
<body>

    <div class="brand-watermark">
        <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5-5-5 5h3v4h4v-4h3z"/></svg>
        CLens
    </div>

    <div class="viewer">
        <div class="loader" id="loader"><div class="spin"></div>Đang tải ảnh...</div>
        <div class="error" id="error">Lỗi tải ảnh</div>
        
        <img id="imgNode" src="">
        <div class="glass-shield"></div> 
    </div>

    <script src="Data.js"></script>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => { if((e.ctrlKey||e.metaKey) && ['s','p','u'].includes(e.key)) e.preventDefault(); if(e.key==='F12') e.preventDefault(); });

        const id = new URLSearchParams(window.location.search).get('id');
        const loader = document.getElementById('loader'), err = document.getElementById('error'), img = document.getElementById('imgNode');

        if(id) {
            CLensData.getImage(id).then(d => {
                loader.style.display = 'none';
                if(d.status === "success" && d.base64Image) {
                    img.src = d.base64Image;
                    img.style.display = 'block';
                    setTimeout(() => { img.classList.add('show'); }, 50);
                } else { err.style.display='block'; err.innerText = d.message || "Ảnh đã bị xóa hoặc không tồn tại."; }
            }).catch(() => { loader.style.display='none'; err.style.display='block'; err.innerText = "Lỗi kết nối mạng."; });
        } else {
            loader.style.display='none'; err.style.display='block'; err.innerText = "Đường dẫn không hợp lệ.";
        }
    </script>
</body>
</html>
