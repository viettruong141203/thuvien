<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ảnh</title>
    
    <!-- Khai báo App PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CLens">
    <link rel="apple-touch-icon" href="icon.png">

    <link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a855f7' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cline x1='14.31' y1='8' x2='20.05' y2='17.94'/%3E%3Cline x1='9.69' y1='8' x2='21.17' y2='8'/%3E%3Cline x1='7.38' y1='12' x2='13.12' y2='2.06'/%3E%3Cline x1='9.69' y1='16' x2='3.95' y2='6.06'/%3E%3Cline x1='14.31' y1='16' x2='2.83' y2='16'/%3E%3Cline x1='16.62' y1='12' x2='10.88' y2='21.94'/%3E%3C/svg%3E" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000000; --accent: rgba(168, 85, 247, 0.15); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: var(--bg); height: 100vh; height: 100dvh; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        .viewer { position: relative; width: 100vw; height: 100%; display: flex; align-items: center; justify-content: center; }
        
        .ambient-glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60vmin; height: 60vmin; background: radial-gradient(circle, var(--accent) 0%, rgba(0,0,0,0) 70%); filter: blur(40px); z-index: 1; opacity: 0; transition: opacity 1.5s ease; pointer-events: none; animation: pulse-glow 8s ease-in-out infinite alternate; }
        @keyframes pulse-glow { 0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; } 100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } }

        #imgNode { position: relative; z-index: 5; max-width: 90%; max-height: 90vh; object-fit: contain; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 25px 50px -12px rgba(0,0,0,1), 0 0 30px rgba(0,0,0,0.8); background: #050505; opacity: 0; transform: scale(0.92) translateY(10px); filter: blur(10px); transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); display: none; pointer-events: none; -webkit-user-drag: none; }
        #imgNode.show { opacity: 1; transform: scale(1) translateY(0); filter: blur(0px); }
        .glass-shield { position: absolute; inset: 0; z-index: 10; background: transparent; -webkit-touch-callout: none; }
        
        .brand-watermark { position: absolute; top: 24px; left: 24px; z-index: 20; display: flex; align-items: center; gap: 8px; color: rgba(255, 255, 255, 0.25); font-weight: 600; font-size: 15px; letter-spacing: -0.5px; pointer-events: none; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .brand-watermark svg { width: 20px; height: 20px; color: rgba(255, 255, 255, 0.25); filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5)); }
        
        .loader { position: absolute; color: #a1a1aa; font-size: 13px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 16px; z-index: 5; transition: 0.3s; }
        .spin { width: 28px; height: 28px; border: 2px solid rgba(255,255,255,0.05); border-top-color: #a855f7; border-radius: 50%; animation: spin 1s cubic-bezier(0.6, 0.1, 0.4, 0.9) infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .error { color: #f87171; background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.2); padding: 12px 24px; border-radius: 12px; display: none; z-index: 5; font-size: 14px; font-weight: 500; backdrop-filter: blur(10px); }
    </style>
</head>
<body>

    <div class="brand-watermark">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="14.31" y1="8" x2="20.05" y2="17.94"></line>
            <line x1="9.69" y1="8" x2="21.17" y2="8"></line>
            <line x1="7.38" y1="12" x2="13.12" y2="2.06"></line>
            <line x1="9.69" y1="16" x2="3.95" y2="6.06"></line>
            <line x1="14.31" y1="16" x2="2.83" y2="16"></line>
            <line x1="16.62" y1="12" x2="10.88" y2="21.94"></line>
        </svg>
        CLens
    </div>

    <div class="viewer">
        <div class="ambient-glow" id="glow"></div>
        <div class="loader" id="loader"><div class="spin"></div>Trích xuất chất lượng gốc...</div>
        <div class="error" id="error">Lỗi tải ảnh</div>
        
        <img id="imgNode" src="">
        <div class="glass-shield"></div> 
    </div>

    <script src="Data.js"></script>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => { if((e.ctrlKey||e.metaKey) && ['s','p','u'].includes(e.key)) e.preventDefault(); if(e.key==='F12') e.preventDefault(); });

        const id = new URLSearchParams(window.location.search).get('id');
        const loader = document.getElementById('loader'), err = document.getElementById('error'), img = document.getElementById('imgNode'), glow = document.getElementById('glow');

        if(id) {
            CLensData.getImage(id).then(d => {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 300);

                if(d.status === "success" && d.base64Image) {
                    img.src = d.base64Image;
                    img.style.display = 'block';
                    setTimeout(() => { 
                        img.classList.add('show'); 
                        glow.style.opacity = '1'; 
                    }, 50);
                } else { err.style.display='block'; err.innerText = d.message || "Ảnh không tồn tại."; }
            }).catch(() => { 
                loader.style.display='none'; err.style.display='block'; err.innerText = "Lỗi kết nối mạng."; 
            });
        } else {
            loader.style.display='none'; err.style.display='block'; err.innerText = "Đường dẫn không hợp lệ.";
        }
    </script>
</body>
</html>
