<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CLens</title>
    <link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a855f7'%3E%3Cpath d='M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5-5-5 5h3v4h4v-4h3z'/%3E%3C/svg%3E" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000000; --accent: rgba(168, 85, 247, 0.15); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: var(--bg); height: 100vh; height: 100dvh; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        .viewer { position: relative; width: 100vw; height: 100%; display: flex; align-items: center; justify-content: center; }
        
        /* Hiệu ứng ánh sáng hắt từ sau bức ảnh (Backlight Spotlight) */
        .ambient-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60vmin; height: 60vmin;
            background: radial-gradient(circle, var(--accent) 0%, rgba(0,0,0,0) 70%);
            filter: blur(40px);
            z-index: 1;
            opacity: 0;
            transition: opacity 1.5s ease;
            pointer-events: none;
            animation: pulse-glow 8s ease-in-out infinite alternate;
        }
        @keyframes pulse-glow { 0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; } 100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } }

        #imgNode { 
            position: relative;
            z-index: 5;
            max-width: 90%; max-height: 90vh; object-fit: contain; 
            
            /* Viền kính siêu mỏng + Bóng đổ nhiều lớp tạo độ nổi 3D */
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,1), 0 0 30px rgba(0,0,0,0.8); 
            background: #050505;
            
            /* Hiệu ứng xuất hiện mượt mà như rạp xiếc */
            opacity: 0; transform: scale(0.92) translateY(10px); 
            filter: blur(10px);
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); 
            display: none; pointer-events: none; -webkit-user-drag: none; 
        }
        
        #imgNode.show { opacity: 1; transform: scale(1) translateY(0); filter: blur(0px); }
        .glass-shield { position: absolute; inset: 0; z-index: 10; background: transparent; -webkit-touch-callout: none; }
        
        .loader { position: absolute; color: #a1a1aa; font-size: 13px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 16px; z-index: 5; transition: 0.3s; }
        .spin { width: 28px; height: 28px; border: 2px solid rgba(255,255,255,0.05); border-top-color: #a855f7; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .error { color: #f87171; background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.2); padding: 12px 24px; border-radius: 12px; display: none; z-index: 5; font-size: 14px; font-weight: 500; backdrop-filter: blur(10px); }
    </style>
</head>
<body>

    <div class="viewer">
        <!-- Ánh sáng nền -->
        <div class="ambient-glow" id="glow"></div>

        <div class="loader" id="loader"><div class="spin"></div>Trích xuất chất lượng gốc...</div>
        <div class="error" id="error">Lỗi tải ảnh</div>
        
        <!-- Bức ảnh tuyệt đẹp -->
        <img id="imgNode" src="">
        <div class="glass-shield"></div> 
    </div>

    <script src="Data.js"></script>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => { if((e.ctrlKey||e.metaKey) && ['s','p','u'].includes(e.key)) e.preventDefault(); if(e.key==='F12') e.preventDefault(); });

        const id = new URLSearchParams(window.location.search).get('id');
        const loader = document.getElementById('loader'), err = document.getElementById('error'), img = document.getElementById('imgNode'), glow = document.getElementById('glow');

        if(id) {
            CLensData.getImage(id).then(d => {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 300);

                if(d.status === "success" && d.base64Image) {
                    img.src = d.base64Image;
                    img.style.display = 'block';
                    setTimeout(() => { 
                        img.classList.add('show'); 
                        glow.style.opacity = '1'; // Bật ánh sáng nền khi ảnh đã hiện
                    }, 50);
                } else { err.style.display='block'; err.innerText = d.message || "Ảnh không tồn tại."; }
            }).catch(() => { 
                loader.style.display='none'; err.style.display='block'; err.innerText = "Lỗi kết nối mạng."; 
            });
        } else {
            loader.style.display='none'; err.style.display='block'; err.innerText = "Đường dẫn không hợp lệ.";
        }
    </script>
</body>
</html>
